<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />

    <title>DSA Interview Cracker — Java DSA problems with dry runs</title>
    <meta
      name="description"
      content="322 Java DSA problems across 24 topics for SDE interviews. Every problem has a clean solution, the exact input format, a step-by-step dry run, complexity analysis and interview notes — and it runs in your browser."
    />
    <meta name="author" content="DSA Interview Cracker" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSA Interview Cracker" />
    <meta property="og:title" content="DSA Interview Cracker — Java DSA problems with dry runs" />
    <meta
      property="og:description"
      content="322 Java DSA problems across 24 topics. Every problem has a step-by-step dry run, complexity analysis and interview notes — and it runs in your browser."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DSA Interview Cracker" />
    <meta
      name="twitter:description"
      content="322 Java DSA problems with dry runs, complexity analysis and an in-browser Java runner."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/icon-512.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DSA Interview Cracker",
        "url": "%VITE_SITE_URL%/",
        "description": "Java DSA problems with step-by-step dry runs, complexity analysis and interview notes.",
        "inLanguage": "en"
      }
    </script>

    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('dsa.theme')
        var dark = stored ? stored === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
      } catch (e) {
        /* localStorage unavailable — keep the default dark class */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>DSA Interview Cracker</h1>
        <p>This study site needs JavaScript enabled to browse the problems and run the solutions.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
