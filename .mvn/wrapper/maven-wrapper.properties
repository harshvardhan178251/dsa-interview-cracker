# Maven Wrapper configuration.
# The wrapper downloads the Maven distribution declared below into
# ~/.m2/wrapper/dists on first run, so no system-wide Maven install is needed.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
