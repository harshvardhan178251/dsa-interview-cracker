name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: Java solutions and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run the test suite
        run: ./mvnw -B test

      - name: Verify every problem runs standalone
        working-directory: web
        run: |
          npm ci
          npm run gen:data
          npm run verify:judge

  web:
    name: Study site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Check the links in the write-ups
        run: node scripts/fix-links.mjs --check

      - name: Check the JavaDoc samples match the frontmatter
        run: node scripts/sync-samples.mjs --check

  backend:
    name: Compiler backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Start the backend
        run: |
          node web/server/index.js &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/api/health && break
            sleep 1
          done

      - name: Test the compiler and the wrong-answer detection
        run: npm run test:backend
        working-directory: web
